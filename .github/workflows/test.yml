name: Test

on:
  push:
    branches: [ main ]
  pull_request:

jobs:
  run-tests:
    name: Run tests
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: true

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y cmake libpng-dev libsdl2-dev libsdl2-ttf-dev

      - name: Run tests
        run: |
          set -euxo pipefail
          make test
